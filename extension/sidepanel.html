<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MemoriX Side Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg-base:       #0b0e0f;
      --bg-surface:    #111517;
      --accent:        #2dff9a;
      --accent-text:   #1adb80;
      --txt-primary:   #e8ecea;
      --txt-secondary: #7a8e8a;
      --txt-muted:     #445250;
      --font-mono:     'IBM Plex Mono', monospace;
      --font-ui:       'IBM Plex Sans', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-base);
      color: var(--txt-primary);
      font-family: var(--font-ui);
      font-size: 13px;
      line-height: 1.5;
    }

    body {
      padding: 16px;
      overflow-y: auto;
    }

    h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 16px;
      font-weight: 600;
      color: var(--txt-primary);
      font-family: var(--font-mono);
      letter-spacing: 0.04em;
    }

    .logo-mark {
      width: 20px;
      height: 20px;
      background: var(--accent);
      border-radius: 4px;
      display: grid;
      place-items: center;
      font-size: 11px;
      color: #000;
      font-weight: 700;
    }

    p {
      color: var(--txt-secondary);
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: rgba(45, 255, 154, 0.1);
      border: 1px solid rgba(45, 255, 154, 0.3);
      border-radius: 4px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--accent-text);
      margin-top: 12px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .feature-list {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .feature-list h3 {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-text);
      font-family: var(--font-mono);
      letter-spacing: 0.04em;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .feature-item {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--txt-secondary);
    }

    .feature-icon {
      color: var(--accent-text);
      font-weight: 600;
      min-width: 16px;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
  </style>
</head>
<body>
  <h2>
    <span class="logo-mark">Ξ</span>
    Related Context
  </h2>

  <p>Open any code file on GitHub, GitLab, or your editor, and MemoriX will automatically match it with your saved snippets.</p>

  <div class="status-badge">
    <span class="status-dot"></span>
    Ready · Waiting for context
  </div>

  <div class="feature-list">
    <h3>One-Click Relate</h3>
    <div class="feature-item">
      <span class="feature-icon">✓</span>
      <span>Scan current page for code patterns</span>
    </div>
    <div class="feature-item">
      <span class="feature-icon">✓</span>
      <span>Match against your snippet library</span>
    </div>
    <div class="feature-item">
      <span class="feature-icon">✓</span>
      <span>Show related projects and patterns</span>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>

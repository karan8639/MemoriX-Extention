<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MemoriX Scratchpad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ── Design Tokens ──────────────────────────────────────────────────── */
    :root {
      --bg-base:       #0b0e0f;
      --bg-surface:    #111517;
      --bg-raised:     #181d1f;
      --bg-overlay:    #1e2426;
      --bg-input:      #141819;

      --border-dim:    rgba(255,255,255,0.06);
      --border-mid:    rgba(255,255,255,0.10);
      --border-bright: rgba(255,255,255,0.16);

      --accent:        #2dff9a;
      --accent-dim:    rgba(45,255,154,0.12);
      --accent-glow:   rgba(45,255,154,0.25);
      --accent-text:   #1adb80;

      --warn:          #ffb347;
      --warn-dim:      rgba(255,179,71,0.12);
      --danger:        #ff5e6c;
      --danger-dim:    rgba(255,94,108,0.10);

      --txt-primary:   #e8ecea;
      --txt-secondary: #7a8e8a;
      --txt-muted:     #445250;
      --txt-code:      #a8ffce;

      --font-mono:     'IBM Plex Mono', 'Cascadia Code', monospace;
      --font-ui:       'IBM Plex Sans', system-ui, sans-serif;

      --radius-sm:     4px;
      --radius-md:     7px;
      --radius-lg:     10px;

      --popup-w:       420px;
      --transition:    150ms cubic-bezier(0.25,0.46,0.45,0.94);
    }

    /* ── Reset ──────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      width: var(--popup-w);
      min-width: var(--popup-w);
      max-width: var(--popup-w);
    }

    body {
      width: var(--popup-w);
      min-width: var(--popup-w);
      background: var(--bg-base);
      color: var(--txt-primary);
      font-family: var(--font-ui);
      font-size: 13px;
      line-height: 1.5;
      overflow-x: hidden;
      background-image: repeating-linear-gradient(
        0deg,
        rgba(45,255,154,0.03) 0px,
        transparent 1px,
        transparent 2px,
        rgba(45,255,154,0.02) 3px
      );
    }

    /* ── Scrollbar ───────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-text); }

    /* ── Header ─────────────────────────────────────────────────────────── */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border-dim);
      background: var(--bg-surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--txt-primary);
      text-decoration: none;
      user-select: none;
    }

    .logo-mark {
      width: 20px;
      height: 20px;
      background: var(--accent);
      border-radius: 4px;
      display: grid;
      place-items: center;
      font-size: 11px;
      color: #000;
      font-weight: 700;
      box-shadow: 0 0 8px var(--accent-glow);
      flex-shrink: 0;
    }

    .logo-text { color: var(--txt-primary); }
    .logo-text span { color: var(--accent-text); }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #snippet-count {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--txt-muted);
      background: var(--bg-overlay);
      border: 1px solid var(--border-dim);
      border-radius: 20px;
      padding: 2px 8px;
      letter-spacing: 0.05em;
    }

    /* ── Toggle Add Button ───────────────────────────────────────────────── */
    #btn-toggle-add {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      background: var(--accent-dim);
      color: var(--accent-text);
      border: 1px solid rgba(45,255,154,0.2);
      border-radius: var(--radius-sm);
      padding: 4px 10px;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
    }

    #btn-toggle-add:hover {
      background: rgba(45,255,154,0.2);
      border-color: rgba(45,255,154,0.4);
    }

    /* ── Add Snippet Panel ───────────────────────────────────────────────── */
    #add-panel {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-dim);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #add-panel.collapsed { display: none; }

    .input-row {
      display: flex;
      gap: 7px;
      align-items: flex-start;
    }

    #snippet-title {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border-mid);
      border-radius: var(--radius-sm);
      color: var(--txt-primary);
      font-family: var(--font-ui);
      font-size: 12px;
      padding: 6px 9px;
      outline: none;
      transition: border-color var(--transition);
      min-width: 0;
    }

    #snippet-title::placeholder { color: var(--txt-muted); }

    #snippet-title:focus { border-color: rgba(45,255,154,0.35); }

    #snippet-code {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-mid);
      border-radius: var(--radius-sm);
      color: var(--txt-code);
      font-family: var(--font-mono);
      font-size: 11.5px;
      line-height: 1.6;
      padding: 8px 10px;
      outline: none;
      resize: vertical;
      min-height: 80px;
      max-height: 180px;
      tab-size: 2;
      transition: border-color var(--transition);
    }

    #snippet-code::placeholder { color: var(--txt-muted); font-style: italic; }

    #snippet-code:focus { border-color: rgba(45,255,154,0.35); }

    .add-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    #auto-tags-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      flex: 1;
      min-height: 20px;
    }

    .tag-preview {
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 2px 6px;
      border-radius: 3px;
      opacity: 0.7;
      animation: tagPop 0.2s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }

    @keyframes tagPop {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 0.7; }
    }

    #btn-save {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius-sm);
      padding: 6px 14px;
      cursor: pointer;
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
      white-space: nowrap;
      flex-shrink: 0;
    }

    #btn-save:hover {
      background: #5affa8;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    #btn-save:active { transform: scale(0.96); }

    #btn-save:disabled {
      background: var(--txt-muted);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ── Search + Filter Bar ─────────────────────────────────────────────── */
    #filter-bar {
      padding: 10px 14px 8px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-dim);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 8px;
      color: var(--txt-muted);
      font-size: 11px;
      pointer-events: none;
      font-family: var(--font-mono);
    }

    #search-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-mid);
      border-radius: var(--radius-sm);
      color: var(--txt-primary);
      font-family: var(--font-mono);
      font-size: 11.5px;
      padding: 6px 28px 6px 26px;
      outline: none;
      transition: border-color var(--transition);
    }

    #search-input::placeholder { color: var(--txt-muted); }

    #search-input:focus { border-color: rgba(45,255,154,0.3); }

    #btn-clear-search {
      position: absolute;
      right: 7px;
      background: none;
      border: none;
      color: var(--txt-muted);
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      padding: 2px;
      display: none;
      transition: color var(--transition);
    }

    #btn-clear-search:hover { color: var(--txt-secondary); }

    #btn-clear-search.visible { display: block; }

    #tag-filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      min-height: 22px;
    }

    .filter-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 2px 8px;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all var(--transition);
      user-select: none;
    }

    .filter-tag:hover { opacity: 1 !important; }

    .filter-tag.inactive { opacity: 0.45; }

    .filter-tag.all {
      background: var(--bg-overlay);
      color: var(--txt-secondary);
      border-color: var(--border-mid);
    }

    .filter-tag.all.active {
      background: var(--bg-raised);
      color: var(--txt-primary);
      border-color: var(--border-bright);
    }

    /* ── Snippet List ────────────────────────────────────────────────────── */
    #snippet-list-wrap {
      height: 320px;
      overflow-y: auto;
      padding: 10px 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ── Empty State ─────────────────────────────────────────────────────── */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
      color: var(--txt-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      text-align: center;
      padding: 20px;
    }

    .empty-glyph {
      font-size: 28px;
      opacity: 0.3;
      line-height: 1;
    }

    #empty-state p { line-height: 1.8; }

    #empty-state kbd {
      font-family: var(--font-mono);
      font-size: 10px;
      background: var(--bg-overlay);
      border: 1px solid var(--border-mid);
      border-radius: 3px;
      padding: 1px 5px;
      color: var(--txt-secondary);
    }

    /* ── Snippet Card ────────────────────────────────────────────────────── */
    .snippet-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: border-color var(--transition), box-shadow var(--transition);
      animation: cardIn 0.22s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
      position: relative;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .snippet-card:hover {
      border-color: var(--border-bright);
      box-shadow: 0 2px 16px rgba(0,0,0,0.3);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px 6px;
      gap: 8px;
      border-bottom: 1px solid var(--border-dim);
    }

    .card-header-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .card-title {
      font-family: var(--font-ui);
      font-weight: 500;
      font-size: 12px;
      color: var(--txt-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .card-title.untitled { color: var(--txt-muted); font-style: italic; }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      flex-shrink: 0;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0.6;
      transition: opacity var(--transition);
    }

    .snippet-card:hover .card-actions { opacity: 1; }

    .card-btn {
      background: transparent;
      border: none;
      color: var(--txt-muted);
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      padding: 4px 6px;
      border-radius: 3px;
      transition: all var(--transition);
    }

    .card-btn:hover { background: var(--bg-overlay); color: var(--txt-secondary); }

    .card-btn.danger:hover { background: var(--danger-dim); color: var(--danger); }

    .card-btn.copy-success { color: var(--accent-text) !important; }

    .card-code-wrap {
      max-height: 150px;
      overflow: hidden;
      position: relative;
      padding: 0;
    }

    .card-code-wrap.expanded { max-height: none; }

    .card-code {
      background: var(--bg-overlay);
      color: var(--txt-code);
      font-family: var(--font-mono);
      font-size: 10.5px;
      line-height: 1.5;
      padding: 8px 10px;
      overflow-x: auto;
      white-space: pre;
      word-break: break-all;
    }

    .code-fade {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 30px;
      background: linear-gradient(to bottom, transparent, var(--bg-surface));
      pointer-events: none;
    }

    .card-code-wrap.expanded .code-fade { display: none; }

    .btn-expand {
      background: transparent;
      border: none;
      color: var(--txt-muted);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      padding: 4px 10px;
      transition: all var(--transition);
      width: 100%;
      text-align: center;
      border-top: 1px solid var(--border-dim);
    }

    .btn-expand:hover { color: var(--accent-text); background: var(--accent-dim); }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-top: 1px solid var(--border-dim);
      font-size: 9.5px;
    }

    .card-meta {
      color: var(--txt-muted);
      font-family: var(--font-mono);
    }

    .card-source {
      color: var(--txt-secondary);
      font-size: 9px;
    }

    .card-source a {
      color: var(--accent-text);
      text-decoration: none;
      transition: color var(--transition);
    }

    .card-source a:hover { color: #5affa8; }

    /* ── Language Tag Colors ─────────────────────────────────────────────── */
    .tag {
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 1px 5px;
      border-radius: 2px;
    }

    .tag-js        { background: rgba(247,223,30,0.12);  color: #f7df1e; }
    .tag-ts        { background: rgba(49,120,198,0.15);  color: #5ab0f7; }
    .tag-py        { background: rgba(55,118,171,0.15);  color: #4e9ccf; }
    .tag-rust      { background: rgba(222,165,132,0.15); color: #dea584; }
    .tag-go        { background: rgba(0,173,216,0.13);   color: #00add8; }
    .tag-css       { background: rgba(86,61,124,0.20);   color: #b97bfc; }
    .tag-html      { background: rgba(227,76,38,0.15);   color: #e34c26; }
    .tag-java      { background: rgba(176,114,25,0.15);  color: #f89820; }
    .tag-cs        { background: rgba(104,33,122,0.18);  color: #c77dff; }
    .tag-cpp       { background: rgba(0,89,157,0.18);    color: #6ab3f5; }
    .tag-ruby      { background: rgba(204,52,45,0.15);   color: #ff7269; }
    .tag-php       { background: rgba(119,123,180,0.18); color: #9b9fe0; }
    .tag-swift     { background: rgba(240,81,56,0.15);   color: #f05138; }
    .tag-kotlin    { background: rgba(127,82,255,0.15);  color: #a97bff; }
    .tag-sql       { background: rgba(0,150,136,0.15);   color: #26c6a8; }
    .tag-bash      { background: rgba(33,150,50,0.15);   color: #5dba68; }
    .tag-json      { background: rgba(200,200,200,0.08); color: #aaa; }
    .tag-yaml      { background: rgba(200,200,200,0.08); color: #aaa; }
    .tag-graphql   { background: rgba(229,53,171,0.15);  color: #e535ab; }
    .tag-docker    { background: rgba(13,183,237,0.13);  color: #0db7ed; }
    .tag-regex     { background: rgba(255,120,50,0.13);  color: #ff9a6c; }
    .tag-react     { background: rgba(97,218,251,0.12);  color: #61dafb; }
    .tag-vue       { background: rgba(65,184,131,0.13);  color: #41b883; }
    .tag-next      { background: rgba(255,255,255,0.08); color: #ccc; }
    .tag-algorithm { background: rgba(255,179,71,0.12);  color: var(--warn); }
    .tag-config    { background: rgba(200,200,200,0.07); color: #888; }
    .tag-snippet   { background: rgba(45,255,154,0.08);  color: var(--accent-text); }

    /* ── Toast Notification ──────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 14px;
      right: 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 8px 12px;
      border: 1px solid rgba(45,255,154,0.3);
      border-radius: var(--radius-sm);
      background: var(--bg-overlay);
      color: var(--txt-primary);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
      z-index: 1000;
    }

    #toast.show {
      opacity: 1;
      pointer-events: all;
    }

    #toast.success { border-color: rgba(45,255,154,0.3); color: var(--accent-text); }

    #toast.error   { border-color: rgba(255,94,108,0.3); color: var(--danger); }

    /* ── Status Bar ──────────────────────────────────────────────────────── */
    #status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-top: 1px solid var(--border-dim);
      background: var(--bg-surface);
      font-size: 9px;
      color: var(--txt-muted);
      font-family: var(--font-mono);
    }

    .status-dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      background: var(--accent);
      border-radius: 50%;
      margin-right: 4px;
      box-shadow: 0 0 4px var(--accent-glow);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    #storage-bar-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #storage-bar {
      width: 60px;
      height: 3px;
      background: var(--bg-overlay);
      border-radius: 2px;
      overflow: hidden;
    }

    #storage-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header id="header">
    <a class="logo" href="#" tabindex="-1">
      <span class="logo-mark">Ξ</span>
      <span class="logo-text">memori<span>x</span></span>
    </a>
    <div class="header-meta">
      <span id="snippet-count">0 snippets</span>
    </div>
    <button id="btn-toggle-add" title="New snippet (Ctrl+N)">+ NEW</button>
  </header>

  <!-- ── Add Snippet Panel ──────────────────────────────────────────────── -->
  <section id="add-panel" class="collapsed" aria-label="Add new snippet">
    <div class="input-row">
      <input
        id="snippet-title"
        type="text"
        placeholder="Untitled snippet"
        autocomplete="off"
        autocapitalize="off"
      />
    </div>
    <textarea
      id="snippet-code"
      placeholder="Paste your code here... (auto-detected language)"
      autocapitalize="off"
      spellcheck="false"
    ></textarea>
    <div class="add-footer">
      <div id="auto-tags-preview"></div>
      <button id="btn-save" disabled>SAVE</button>
    </div>
  </section>

  <!-- ── Search + Tag Filter ────────────────────────────────────────────── -->
  <div id="filter-bar">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input
        id="search-input"
        type="text"
        placeholder="Search snippets..."
        autocomplete="off"
      />
      <button id="btn-clear-search" title="Clear search">✕</button>
    </div>
    <div id="tag-filter-row" role="group" aria-label="Filter by tag"></div>
  </div>

  <!-- ── Snippet List ────────────────────────────────────────────────────── -->
  <main id="snippet-list-wrap" role="list" aria-label="Saved snippets">
    <div id="empty-state" aria-live="polite">
      <span class="empty-glyph">⬡</span>
      <p>No snippets yet.<br />Hit <kbd>+ NEW</kbd> to save your first one.</p>
    </div>
  </main>

  <!-- ── Status Bar ─────────────────────────────────────────────────────── -->
  <footer id="status-bar">
    <span><span class="status-dot"></span>local · private</span>
    <span id="storage-bar-wrap">
      <span id="storage-label" style="min-width: 30px;">0 B</span>
      <div id="storage-bar"><div id="storage-fill"></div></div>
    </span>
  </footer>

  <!-- ── Toast ──────────────────────────────────────────────────────────── -->
